<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tshirt-pipeline</title>
<style>
  :root {
    --chrome: #4a4a4d; --panel: #3c3c40; --line: #5a5a5f;
    --text: #ececef; --dim: #a9a9b0; --accent: #7fb4ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; height: 100vh; display: grid; grid-template-columns: 340px 1fr;
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--chrome); color: var(--text);
  }
  /* Khung trang cố tình để xám trung tính: nền trắng làm mực sáng biến mất và
     trông như thủng, đúng cái bẫy mà trang này sinh ra để tránh. */
  aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  header { padding: 14px 16px; border-bottom: 1px solid var(--line); }
  header h1 { margin: 0 0 2px; font-size: 15px; font-weight: 600; }
  header p { margin: 0; color: var(--dim); font-size: 12px; }
  header button { margin-top: 10px; width: 100%; }
  #list { overflow-y: auto; flex: 1; padding: 8px; display: flex; flex-direction: column; gap: 8px; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px;
    cursor: pointer; display: grid; grid-template-columns: 56px 1fr; gap: 10px; align-items: center;
  }
  .card.on { border-color: var(--accent); }
  .card img { width: 56px; height: 56px; object-fit: contain; background: #808080; border-radius: 4px; }
  .card .nm { font-size: 12px; word-break: break-all; line-height: 1.3; }
  .card .st { font-size: 11px; color: var(--dim); margin-top: 2px; }
  .card .st b { color: var(--accent); font-weight: 600; }
  main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #bar {
    padding: 10px 16px; border-bottom: 1px solid var(--line); display: flex; gap: 14px;
    align-items: center; flex-wrap: wrap;
  }
  label { font-size: 12px; color: var(--dim); display: inline-flex; gap: 6px; align-items: center; }
  select, input[type=number], input[type=text] {
    background: var(--panel); color: var(--text); border: 1px solid var(--line);
    border-radius: 5px; padding: 4px 6px; font: inherit; font-size: 12px;
  }
  input[type=number] { width: 66px; }
  input[type=text] { width: 96px; }
  button {
    background: var(--accent); color: #10233d; border: 0; border-radius: 6px;
    padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  #stage { flex: 1; overflow: auto; padding: 16px; display: flex; gap: 16px; min-height: 0; }
  .pane { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
  .pane h2 { margin: 0; font-size: 12px; font-weight: 600; color: var(--dim); }
  /* Ảnh luôn nằm gọn trong khung, dù khung in dọc 4500 x 5100 trên màn hình ngang: khung là
     flex có chiều cao xác định nên max-height 100% của ảnh có nghĩa. Bấm vào ảnh để xem 1:1
     bản xem trước 1400 px và cuộn, bấm lần nữa để thu về. */
  .view {
    flex: 1; border-radius: 8px; border: 1px solid var(--line); display: flex;
    align-items: center; justify-content: center; padding: 10px; min-height: 240px; overflow: hidden;
  }
  .view img { max-width: 100%; max-height: 100%; object-fit: contain; cursor: zoom-in; }
  .view.zoom { display: block; overflow: auto; }
  .view.zoom img { max-width: none; max-height: none; cursor: zoom-out; }
  /* Viền đứt = mép khung in. Không có nó thì khung trong suốt lẫn vào nền xem và
     không thể biết hình đang nằm ở đâu trong khung. */
  #outview img { outline: 1px dashed rgba(255,255,255,.45); outline-offset: 0; }
  #hint { padding: 8px 16px 0; color: #ffd479; font-size: 12px; }
  #hint:empty { display: none; }
  .checker {
    background-image:
      linear-gradient(45deg, #bbb 25%, transparent 25%), linear-gradient(-45deg, #bbb 25%, transparent 25%),
      linear-gradient(45deg, transparent 75%, #bbb 75%), linear-gradient(-45deg, transparent 75%, #bbb 75%);
    background-size: 22px 22px;
    background-position: 0 0, 0 11px, 11px -11px, -11px 0;
    background-color: #fff;
  }
  #nums { display: flex; gap: 22px; padding: 10px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; align-items: flex-start; }
  /* Ô kết luận đứng trước các con số: câu trả lời trước, dẫn chứng sau. */
  .verdict { border-radius: 8px; padding: 8px 14px; min-width: 190px; }
  .verdict .lbl { font-size: 15px; font-weight: 700; }
  .verdict .why { font-size: 11px; line-height: 1.45; margin-top: 4px; opacity: .92; }
  .verdict.dat { background: #1f3a2a; border: 1px solid #3f7a55; color: #b6f0c8; }
  .verdict.xem { background: #3b3320; border: 1px solid #8a7433; color: #ffd479; }
  .verdict.hong { background: #3a2426; border: 1px solid #7a4448; color: #ffb4b4; }
  #nums div { font-size: 12px; color: var(--dim); }
  #nums b { display: block; font-size: 17px; color: var(--text); font-weight: 600; }
  #msg { padding: 0 16px 10px; color: var(--dim); font-size: 12px; white-space: pre-wrap; }
  #errs { padding: 0 16px 12px; }
  #errs:empty { display: none; }
  #errs details {
    background: #3a2426; border: 1px solid #7a4448; border-radius: 6px; padding: 8px 10px; margin-top: 8px;
  }
  #errs summary { cursor: pointer; color: #ffb4b4; font-size: 12px; font-weight: 600; }
  #errs pre {
    margin: 8px 0 0; font-size: 11px; line-height: 1.4; color: #ffd8d8; overflow-x: auto;
    white-space: pre-wrap; word-break: break-word;
  }
  .empty { color: var(--dim); font-size: 13px; padding: 20px; text-align: center; }
  #flags-main, #flags-adv { display: contents; }
  #flags-adv { display: flex; gap: 14px; flex-wrap: wrap; padding: 8px 0 2px; }
  #adv { padding: 8px 16px 0; }
  #adv summary { cursor: pointer; color: var(--dim); font-size: 12px; }
  #adv[open] summary { margin-bottom: 4px; }
  #audit { padding: 0 16px; max-height: 40vh; overflow: auto; }
  #audit:empty { display: none; }
  #audit table { border-collapse: collapse; width: 100%; font-size: 12px; }
  #audit th { text-align: right; color: var(--dim); font-weight: 500; padding: 4px 8px; position: sticky; top: 0; background: var(--chrome); }
  #audit th:last-child, #audit td:last-child { text-align: left; }
  #audit td { padding: 3px 8px; text-align: right; border-top: 1px solid var(--line); }
  #audit tr.warn td { color: #ffd479; }
  #audit .why { color: #ffd479; font-size: 11px; }
  a.dl {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); text-decoration: none;
    border-radius: 6px; padding: 6px 12px; font-size: 12px;
  }
  a.dl[hidden] { display: none; }
  #variantbox[hidden] { display: none; }
  #nums .cmd { flex-basis: 100%; }
  .verdict .why.info { opacity: .8; }
  /* Cảnh báo của lần chạy, cùng câu chữ với terminal: chốt chặn bỏ qua tô đặc, phủ thấp DTF, ảnh gốc nhỏ. */
  #nums .note { flex-basis: 100%; color: #ffd479; font-size: 12px; padding: 6px 10px; border-left: 3px solid #ffd479; background: rgba(255,212,121,.08); }
  #nums .cmd b { font-size: 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-weight: 500; user-select: all; }
  body.drop::after {
    content: "Thả ảnh vào đây"; position: fixed; inset: 12px; border: 3px dashed var(--accent);
    border-radius: 14px; display: grid; place-items: center; font-size: 20px; font-weight: 600;
    background: rgba(20,30,50,.72); color: var(--text); pointer-events: none; z-index: 9;
  }
</style>
</head>
<body>
<aside>
  <header>
    <h1>tshirt-pipeline</h1>
    <p id="count">đang nạp…</p>
    <button id="addbtn" class="ghost" title="chọn ảnh png, jpg, webp; hoặc kéo thả vào bất cứ đâu trên trang">Thêm ảnh…</button>
    <input type="file" id="addfile" multiple accept="image/png,image/jpeg,image/webp" hidden>
  </header>
  <div id="list"></div>
</aside>

<main>
  <div id="bar">
    <div id="flags-main"></div>
    <button id="run">Chạy ảnh đang chọn</button>
    <button id="runall" class="ghost">Chạy tất cả đang chờ</button>
    <label>cùng lúc <input type="number" id="workers" value="2" min="1" max="6" step="1"></label>
    <span style="flex:1"></span>
    <button id="auditbtn" class="ghost">Chấm cả lô</button>
    <label id="variantbox" hidden>bản in <select id="variant" title="ảnh này có nhiều file in, chọn bản muốn xem"></select></label>
    <a class="dl" id="dl" hidden download>Tải file in</a>
    <label title="màu đi qua hồ sơ CMYK để thấy trước màu in xỉn đi bao nhiêu"><input type="checkbox" id="proof"> xem như in</label>
    <label>nền xem
      <select id="bgpick">
        <option value="shirt">màu áo</option>
        <option value="#808080">xám</option>
        <option value="checker">checkerboard</option>
        <option value="#ffffff">trắng</option>
      </select>
    </label>
  </div>

  <details id="adv"><summary>cờ nâng cao</summary><div id="flags-adv"></div></details>

  <div id="hint"></div>

  <div id="stage">
    <div class="pane"><h2>ảnh gốc</h2><div class="view" id="srcview"></div></div>
    <div class="pane"><h2>file in, ghép trên nền đã chọn</h2><div class="view" id="outview"></div></div>
  </div>

  <div id="audit"></div>

  <div id="nums"></div>
  <div id="msg"></div>
  <div id="errs"></div>
</main>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
const state = { images: [], pick: null, report: null, polling: false, saved: {} };

// Cờ nhớ theo từng ảnh, không phải một bộ chung cho cả lô: ảnh có người cần --fill-holes,
// poster thì không, và bản in nhỏ cần vị trí riêng. Giữ qua localStorage để đóng trang mở lại
// vẫn còn.
// Cờ dựng từ /api/config, tức từ chính parse_args của dòng lệnh. Thêm cờ mới vào CLI là trang có
// ngay, không phải chép lại mặc định ở hai nơi rồi lệch nhau.
let CONFIG = { flags: [] };
const DEFAULTS = {};
try { state.saved = JSON.parse(localStorage.getItem("tsp-settings") || "{}"); } catch (e) { state.saved = {}; }

function control(f) {
  const id = "f_" + f.name;
  let input;
  if (f.kind === "bool") {
    input = `<input type="checkbox" id="${id}">`;
    return `<label title="${esc(f.hint)}">${input} ${esc(f.label)}</label>`;
  }
  if (f.choices) {
    input = `<select id="${id}">` + f.choices.map(c => `<option>${esc(c)}</option>`).join("") + `</select>`;
  } else if (f.kind === "float" || f.kind === "NoneType") {
    input = `<input type="number" id="${id}" step="any" placeholder="mặc định">`;
  } else {
    input = `<input type="text" id="${id}">`;
  }
  return `<label title="${esc(f.hint)}">${esc(f.label)} ${input}</label>`;
}

function readBar() {
  const out = {};
  for (const f of CONFIG.flags) {
    const el = $("#f_" + f.name);
    if (!el) continue;
    if (f.kind === "bool") out[f.name] = el.checked;
    else if (f.kind === "float") out[f.name] = el.value === "" ? f.default : parseFloat(el.value);
    else if (f.kind === "NoneType") out[f.name] = el.value === "" ? null : parseFloat(el.value);
    else out[f.name] = el.value.trim() || f.default;
  }
  return out;
}

function writeBar(s) {
  for (const f of CONFIG.flags) {
    const el = $("#f_" + f.name);
    if (!el) continue;
    const v = s[f.name] === undefined ? f.default : s[f.name];
    if (f.kind === "bool") el.checked = !!v;
    else el.value = v === null ? "" : v;
  }
  hint();
}

function settingsFor(name) {
  return Object.assign({}, DEFAULTS, state.saved[name] || {});
}

function remember() {
  if (!state.pick) return;
  state.saved[state.pick] = readBar();
  try { localStorage.setItem("tsp-settings", JSON.stringify(state.saved)); } catch (e) { /* riêng tư */ }
}

function hint() {
  // Ở cỡ 100% thiết kế đã lấp kín khung, nên neo vào góc nào cũng gần như nhau: không còn
  // chỗ trống để dịch. Đây là chỗ dễ tưởng là app hỏng nhất.
  const s = readBar();
  $("#hint").textContent = (s.place && s.place !== "center" && s.scale >= 95)
    ? `Cỡ đang ${s.scale}% nên hình lấp gần kín khung, đặt ở "${s.place}" sẽ nhìn gần như căn giữa. `
      + `Giảm cỡ xuống thì mới thấy hình dịch vào góc, ví dụ 26% cho một bản in nhỏ.`
    : "";
}

function tagFor(name) {
  const s = state.saved[name];
  if (!s) return "";
  return CONFIG.flags
    .filter(f => s[f.name] !== undefined && s[f.name] !== null && s[f.name] !== f.default)
    .map(f => f.kind === "bool" ? f.label : `${f.label} ${s[f.name]}`)
    .join(" · ");
}

async function loadConfig() {
  CONFIG = await api("/api/config");
  for (const f of CONFIG.flags) DEFAULTS[f.name] = f.default;
  $("#flags-main").innerHTML = CONFIG.flags.filter(f => f.group === "chính").map(control).join("");
  $("#flags-adv").innerHTML = CONFIG.flags.filter(f => f.group !== "chính").map(control).join("");
  for (const f of CONFIG.flags) {
    const el = $("#f_" + f.name);
    if (el) el.oninput = el.onchange = () => {
      remember(); hint(); loadList();
      if (state.pick) $("#msg").textContent = "Cờ đã đổi cho ảnh này, bấm Chạy để áp dụng.";
    };
  }
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json();
  if (j && j.error) throw new Error(j.error);
  return j;
}

async function loadList() {
  state.images = await api("/api/images");
  const waiting = state.images.filter(i => i.waiting).length;
  $("#count").textContent = `${state.images.length} ảnh · ${waiting} đang chờ`;
  const list = $("#list");
  list.innerHTML = "";
  if (!state.images.length) {
    list.innerHTML = '<div class="empty">Thả ảnh vào thư mục <b>input/</b> rồi tải lại trang.</div>';
    return;
  }
  for (const im of state.images) {
    const el = document.createElement("div");
    el.className = "card" + (state.pick === im.name ? " on" : "");
    const tag = tagFor(im.name);
    el.innerHTML = `<img loading="lazy" src="/src/${encodeURIComponent(im.name)}" alt="">
      <div><div class="nm">${im.name}</div>
      <div class="st">${im.waiting ? "đang chờ" : "đã xử lý"}${im.done ? " · <b>có file in</b>" : ""}${tag ? "<br>" + tag : ""}</div></div>`;
    el.onclick = () => select(im.name);
    list.appendChild(el);
  }
}

// Một ảnh gốc có thể có nhiều file in (khác khung, vị trí, mực). Không nói gì thì xem bản mới
// nhất; ô "bản in" đổi sang bản khác. Mọi đường dẫn file đều mang theo bản đang xem.
async function select(name, variant) {
  state.pick = name;
  writeBar(settingsFor(name));
  loadList();
  const im = state.images.find(i => i.name === name);
  const outs = (im && im.outs) || [];
  if (!variant || !outs.includes(variant)) variant = outs[0] || null;
  state.variant = variant;
  const q = variant ? `?out=${encodeURIComponent(variant)}` : "";
  const box = $("#variantbox"), sel = $("#variant");
  box.hidden = outs.length < 2;
  sel.innerHTML = outs.map(o => `<option${o === variant ? " selected" : ""}>${esc(o)}</option>`).join("");
  $("#srcview").innerHTML = `<img src="/src/${encodeURIComponent(name)}" alt="">`;
  $("#dl").hidden = true;
  const out = $("#outview");
  const route = $("#proof").checked ? "proof" : "out";   // xem như in: bản đã qua hồ sơ CMYK
  out.innerHTML = `<img src="/${route}/${encodeURIComponent(name)}${q}${q ? "&" : "?"}t=${Date.now()}" alt=""
                        onerror="this.replaceWith(Object.assign(document.createElement('div'),
                        {className:'empty', textContent:'Chưa có file in. Bấm Chạy.'}))">`;
  state.report = null;
  $("#nums").innerHTML = "";
  try {
    const rep = await api(`/api/report/${encodeURIComponent(name)}${q}`);
    if (rep && rep.out) {
      state.report = rep;
      showNums(rep);
      const dl = $("#dl");
      dl.href = `/file/${encodeURIComponent(name)}${q}`;
      dl.setAttribute("download", rep.out || "");
      dl.textContent = "Tải file in";
      dl.title = rep.out || "";
      dl.hidden = false;
    }
  } catch (e) { /* chưa chạy thì chưa có số, không sao */ }
  paintBg();
}
$("#variant").onchange = () => { if (state.pick) select(state.pick, $("#variant").value); };
$("#proof").onchange = () => { if (state.pick) select(state.pick, state.variant); };

function showNums(r) {
  const v = r.muc ? `<div class="verdict ${r.muc}">
      <div class="lbl">${esc(r.nhan)}</div>
      ${r.why && r.why.length ? `<div class="why">${r.why.map(w => "• " + esc(w)).join("<br>")}</div>` : ""}
      ${r.info && r.info.length ? `<div class="why info">${r.info.map(w => "· " + esc(w)).join("<br>")}</div>` : ""}
    </div>` : "";
  // Cột "—" là không đo được, không phải 0: file cắt hình in lên áo khác màu nền mà ta không
  // biết là màu gì, còn file một màu mực thì cố ý khác ảnh gốc.
  const na = "không đo được với file cắt hình cho áo khác màu nền";
  const meta = r.meta || {};
  $("#nums").innerHTML = v + `
    <div>mực đặc<b>${r.dac}%</b></div>
    <div title="${r.thua == null ? na : ""}">mực trùng màu áo<b>${r.thua == null ? "—" : r.thua + "%"}</b></div>
    <div title="dưới 40% độ phủ: in DTF dễ bong">phủ thấp<b${r.phu_thap > 5 ? ' style="color:#ffd479"' : ''}>${r.phu_thap}%</b></div>
    <div title="mực trong nét mảnh hơn 0,5 mm: in DTF dễ bong, thử 'nới nét DTF'">nét mảnh<b${r.manh > 5 ? ' style="color:#ffd479"' : ''}>${r.manh ?? "—"}%</b></div>
    <div title="mực là đốm rời nhỏ hơn 1 mm²: dễ rơi khỏi bàn ép">đốm nhỏ<b${r.dom > 1 ? ' style="color:#ffd479"' : ''}>${r.dom ?? "—"}%</b></div>
    <div title="${r.gamut == null ? "máy không có hồ sơ CMYK" : `mực lệch quá 10 ΔE sau khi qua hồ sơ CMYK, lệch lớn nhất ${r.de_max} ΔE. Bật 'xem như in' để thấy`}">ngoài gamut<b${r.gamut > 30 ? ' style="color:#ffd479"' : ''}>${r.gamut == null ? "—" : r.gamut + "%"}</b></div>
    <div title="${r.sai_so == null ? "không đo được: file cắt hình hoặc một màu mực" : ""}">sai số khi in<b>${r.sai_so ?? "—"}</b></div>
    <div>màu áo<b style="font-size:13px">${r.shirt || "khác màu nền, chọn ở ô nền xem"}</b></div>
    <div>tên file<b style="font-size:12px">${esc(r.out || "—")}</b></div>
    ${meta.how ? `<div>cách<b style="font-size:13px">${esc(meta.how)}</b></div>` : ""}
    ${meta.cmd ? `<div class="cmd" title="dòng lệnh chạy lại ra đúng file này">cờ đã dùng<b>${esc(meta.cmd)}</b></div>`
               : `<div class="cmd">cờ đã dùng<b>— (file làm trước khi có mục này)</b></div>`}
    ${(meta.notes || []).map(n => `<div class="note">${esc(n)}</div>`).join("")}`;
}

function paintBg() {
  const v = $("#bgpick").value;
  const el = $("#outview");
  el.classList.toggle("checker", v === "checker");
  el.style.background = v === "checker" ? "" :
    (v === "shirt" ? ((state.report && state.report.shirt) || "#808080") : v);
}

async function run(names) {
  if (!names.length) { $("#msg").textContent = "Chưa chọn ảnh nào."; return; }
  remember();
  await api("/api/run", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      jobs: names.map(n => ({ name: n, settings: settingsFor(n) })),
      workers: parseInt($("#workers").value) || 2,
    })
  });
  poll();
}

async function poll() {
  if (state.polling) return;
  state.polling = true;
  $("#run").disabled = $("#runall").disabled = true;
  while (true) {
    const st = await api("/api/status");
    const errs = Object.entries(st.errors);
    $("#msg").textContent = st.running
      ? `Đang chạy ${st.current.join(", ")} · còn ${st.left} · xong ${st.done.length}`
      : (st.done.length || errs.length ? `Xong ${st.done.length} ảnh${errs.length ? `, lỗi ${errs.length}` : ""}` : "");
    // Lỗi hiện đủ: một dòng cuối của traceback thường không nói được vì sao.
    $("#errs").innerHTML = errs.map(([n, e]) => {
      const first = (e.trim().split("\n").pop() || "").slice(0, 160);
      return `<details><summary>${esc(n)} — ${esc(first)}</summary><pre>${esc(e)}</pre></details>`;
    }).join("");
    if (!st.running) break;
    await new Promise(r => setTimeout(r, 1200));
  }
  $("#run").disabled = $("#runall").disabled = false;
  state.polling = false;
  await loadList();
  if (state.pick) await select(state.pick);   // bản mới nhất, tức file vừa chạy xong
}

$("#run").onclick = () => run(state.pick ? [state.pick] : []).catch(e => $("#msg").textContent = e.message);
$("#runall").onclick = () => run(state.images.filter(i => i.waiting).map(i => i.name))
  .catch(e => $("#msg").textContent = e.message);
$("#bgpick").onchange = paintBg;
$("#auditbtn").onclick = async () => {
  const btn = $("#auditbtn");
  if ($("#audit").innerHTML) { $("#audit").innerHTML = ""; return; }   // bấm lần nữa để đóng bảng
  btn.disabled = true;
  btn.textContent = "đang chấm…";
  try {
    const rows = await api("/api/audit");
    const avg = k => { const v = rows.map(r => r[k]).filter(x => x != null);
                       return v.length ? (v.reduce((s, x) => s + x, 0) / v.length).toFixed(2) : "—"; };
    $("#audit").innerHTML = rows.length ? `<table>
      <tr><th>đặc %</th><th title="dưới 40% độ phủ: in DTF dễ bong">phủ thấp %</th><th title="nét mảnh hơn 0,5 mm">mảnh %</th><th title="ngoài gamut CMYK">gamut %</th><th>thừa %</th><th>sai số</th><th>file</th></tr>
      ${rows.map(r => `<tr class="${r.why.length ? "warn" : ""}">
        <td>${r.dac}</td><td>${r.phu_thap}</td><td>${r.manh ?? "—"}</td><td>${r.gamut ?? "—"}</td><td>${r.thua ?? "—"}</td><td>${r.sai_so ?? "—"}</td>
        <td>${esc(r.name)}${r.why.length ? `<div class="why">${r.why.map(esc).join("<br>")}</div>` : ""}</td>
      </tr>`).join("")}
      <tr><td>${avg("dac")}</td><td>${avg("phu_thap")}</td><td>${avg("manh")}</td><td>${avg("gamut")}</td><td>${avg("thua")}</td><td>${avg("sai_so")}</td>
          <td>trung bình của ${rows.length} file</td></tr></table>`
      : '<div class="empty">Chưa có file in nào để chấm.</div>';
  } catch (e) { $("#msg").textContent = e.message; }
  btn.disabled = false;
  btn.textContent = "Chấm cả lô";
};
// Kéo thả ảnh vào bất cứ đâu trên trang: file được ghi thẳng vào input/ rồi hiện trong danh sách.
let dragDepth = 0;
addEventListener("dragenter", e => { e.preventDefault(); if (++dragDepth === 1) document.body.classList.add("drop"); });
addEventListener("dragover", e => e.preventDefault());
addEventListener("dragleave", e => { e.preventDefault(); if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("drop"); } });
addEventListener("drop", e => {
  e.preventDefault();
  dragDepth = 0;
  document.body.classList.remove("drop");
  addFiles([...(e.dataTransfer?.files || [])]);
});
$("#addbtn").onclick = () => $("#addfile").click();
$("#addfile").onchange = async () => { await addFiles([...$("#addfile").files]); $("#addfile").value = ""; };
// Bấm vào ảnh để xem 1:1 và cuộn; bấm lần nữa để thu về khung.
$("#stage").addEventListener("click", e => {
  const view = e.target.closest(".view");
  if (view && e.target.tagName === "IMG") view.classList.toggle("zoom");
});

async function addFiles(files) {
  if (!files.length) return;
  const added = [];
  for (const f of files) {
    try {
      const r = await api("/api/upload?name=" + encodeURIComponent(f.name), { method: "POST", body: f });
      added.push(r.name);
    } catch (err) { $("#msg").textContent = `${f.name}: ${err.message}`; }
  }
  if (!added.length) return;
  $("#msg").textContent = `Đã thêm ${added.length} ảnh vào input/`;
  await loadList();
  await select(added[0]);
}

loadConfig()
  .then(loadList)
  .then(() => { if (state.images.length) select(state.images[0].name); })
  .catch(e => { $("#msg").textContent = e.message; });
poll();
</script>
